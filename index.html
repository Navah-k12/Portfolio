<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portafolio | Bryan Canche</title>
<meta name="description" content="Portafolio de desarrollo móvil y ciberseguridad, estilo videojuego.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stars" aria-hidden="true"></div>
<header class="hero">
  <div class="avatar" aria-hidden="true"><i></i></div>
  <div>
    <p class="insert">▶ PLAYER 1 READY</p>
    <h1 id="nombre"></h1>
    <p class="clase" id="clase"></p>
    <p class="bio" id="bio"></p>
    <nav id="links"></nav>
  </div>
</header>

<main>
  <section>
    <h2>&gt; HABILIDADES</h2>
    <div id="skills" class="skills"></div>
  </section>

  <section>
    <h2>&gt; MISIONES <small id="contador"></small></h2>
    <div id="filtros" class="filtros"></div>
    <div id="proyectos" class="grid"></div>
  </section>
</main>

<footer>© <span id="anio"></span> · GAME OVER? NO. CONTINUAR ▮</footer>
<div id="modal" class="modal" hidden><img alt=""><button aria-label="Cerrar">X</button></div>
<script src="proyectos.js"></script>
<script src="app.js"></script>
</body>
</html>
